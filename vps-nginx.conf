# Nginx для revyakin.tech на VPS (без Docker).
# Раздаёт собранную статику из /var/www/revyakin напрямую. SSL — Let's Encrypt.
#
# Установка на сервере:
#   sudo cp vps-nginx.conf /etc/nginx/sites-available/revyakin.tech
#   sudo ln -s /etc/nginx/sites-available/revyakin.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# http (и с www, и без) → сразу на https без www, одним редиректом
server {
    listen 80;
    listen [::]:80;
    server_name revyakin.tech www.revyakin.tech;
    return 301 https://revyakin.tech$request_uri;
}

# https://www → https без www (главное зеркало — без www, как canonical и sitemap).
# Сертификат должен включать www.revyakin.tech.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.revyakin.tech;

    ssl_certificate /etc/letsencrypt/live/revyakin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revyakin.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://revyakin.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name revyakin.tech;

    ssl_certificate /etc/letsencrypt/live/revyakin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revyakin.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Заголовки безопасности. ВАЖНО: add_header внутри location отменяет заголовки
    # с уровня server, поэтому в каждом location с add_header они повторены.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15768000" always;

    root /var/www/revyakin;
    index index.html;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Пререндеренные страницы: /services → services.html; остальное (SPA) → index.html.
    # HTML не кешируем: он ссылается на хешированные ассеты, которые rsync --delete удаляет.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    # index.html не кешируем (ссылается на хешированные ассеты)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    # /assets/ — сборка Vite, хеш в имени файла → кешируем навсегда.
    # ^~ — чтобы regex-локейшн ниже не перехватывал картинки из /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        access_log off;
    }

    # Остальная статика из public/ (логотипы, og.jpg, иконки) — БЕЗ хеша в имени.
    # Кеш на 7 дней, дальше браузер переспрашивает (ETag → 304), чтобы замена файла
    # под тем же именем дошла до посетителей.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        access_log off;
    }
}
